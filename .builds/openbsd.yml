image: openbsd/latest
sources:
  - https://git.sr.ht/~rkta/w3m
packages:
  - boehm-gc
  - gettext-tools
triggers:
  - action: email
    condition: always
    to: mail@rkta.de
environment:
  NPROC: '8'
tasks:
  - default: |
      cd w3m
      t/build default

  - debian: |
      cd w3m
      t/build debian

  - gdk-pixbuf: |
      cd w3m
      t/build gdk_pixbuf

  - disable: |
      cd w3m
      t/build disable

  - lto: |
      cd w3m
      t/build lto
